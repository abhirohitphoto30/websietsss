<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>__SITE_TITLE__</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:#111;
  }
  .switcher-bar{
    position:fixed;
    top:max(14px, env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    display:flex;
    gap:8px;
    max-width:94vw;
    overflow-x:auto;
    scrollbar-width:none;
    background:rgba(255,255,255,0.9);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    padding:6px;
    border-radius:999px;
    box-shadow:0 4px 18px rgba(0,0,0,0.18);
  }
  .switcher-bar::-webkit-scrollbar{ display:none; }
  .switcher-bar button{
    flex:0 0 auto;
    border:none;
    outline:none;
    cursor:pointer;
    font-size:0.78rem;
    letter-spacing:0.05em;
    font-weight:600;
    white-space:nowrap;
    padding:8px 16px;
    border-radius:999px;
    background:transparent;
    color:#555;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .switcher-bar button.active{ background:#c14672; color:#fff; }
  .switcher-bar button:not(.active):hover{ background:#f0dbe3; }

  .frame-wrap{ position:relative; width:100%; height:100%; }
  .frame-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:none;
    background:#fff;
  }
  .frame-wrap iframe.active{ display:block; }

  .empty{
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#eee;
    padding:2rem;
    line-height:1.7;
  }
</style>
</head>
<body>

<div class="switcher-bar" id="bar"></div>
<div class="frame-wrap" id="frames"></div>
<div class="empty" id="empty">Abhi koi page nahi hai.<br><code>pages/</code> folder me <code>DD-MM-YYYY.html</code> file daalo.</div>

<script>
/*__SITE_DATA__*/
(function(){
  var site = window.SITE || { pages: [] };
  var pages = site.pages;
  var bar = document.getElementById('bar');
  var frames = document.getElementById('frames');
  var current = null;

  if(!pages.length){
    bar.style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
    return;
  }

  pages.forEach(function(p){
    var b = document.createElement('button');
    b.id = 'btn-' + p.id;
    b.textContent = p.label;
    b.addEventListener('click', function(){ show(p.id, true); });
    bar.appendChild(b);
  });

  function show(id, updateHash){
    var page = pages.find(function(p){ return p.id === id; });
    if(!page) return;
    current = id;

    var frame = document.getElementById('frame-' + id);
    if(!frame){                       // pehli baar khulne par hi load hoga (lazy)
      frame = document.createElement('iframe');
      frame.id = 'frame-' + id;
      frame.title = page.label;
      frame.src = page.src;
      frames.appendChild(frame);
    }
    pages.forEach(function(p){
      var f = document.getElementById('frame-' + p.id);
      if(f) f.classList.toggle('active', p.id === id);
      document.getElementById('btn-' + p.id).classList.toggle('active', p.id === id);
    });
    var btn = document.getElementById('btn-' + id);
    if(btn.scrollIntoView) btn.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
    if(updateHash) history.replaceState(null, '', '#' + id);
  }

  var fromHash = decodeURIComponent((location.hash || '').slice(1));
  var start = pages.some(function(p){ return p.id === fromHash; })
    ? fromHash
    : (site.defaultPage === 'first' ? pages[0].id : pages[pages.length - 1].id);
  show(start, false);
})();
</script>
</body>
</html>
